# Optional containerized ROS1 stack for one side of the SIL link.
#
#   ROS_MASTER_URI=... ROS_IP=<this-host-ip> docker compose \
#       -f sil/docker/docker-compose.yml up bridge
#
# Add `--profile roscore` on the machine that hosts the ROS master.
services:
  bridge:
    build:
      context: ../..
      dockerfile: sil/docker/Dockerfile.bridge
    # Host networking keeps 127.0.0.1:5560/5561 next to the compute process and
    # lets ROS1 reach the peer over the LAN.
    network_mode: host
    environment:
      ROS_MASTER_URI: ${ROS_MASTER_URI:-http://127.0.0.1:11311}
      ROS_IP: ${ROS_IP:-127.0.0.1}
      SIL_BRIDGE_IN: "5560"
      SIL_BRIDGE_OUT: "5561"
    restart: unless-stopped

  roscore:
    image: ros:noetic-ros-base
    network_mode: host
    command: roscore -p 11311
    profiles: ["roscore"]
    restart: unless-stopped
